# Liquibase Properties
# 用于 Liquibase Maven 插件

# Database Connection
url=jdbc:postgresql://localhost:5432/bookstore_db
username=bookstoreadmin
password=bookstoreadmin
driver=org.postgresql.Driver

# Changelog File
changeLogFile=db/changelog/db.changelog-master.yaml


# Optional: Default Schema
defaultSchemaName=public

# Optional: Contexts (comma-separated)
# contexts=dev,test

# Optional: Labels (comma-separated)
# labels=feature1,bugfix2

# Optional: Logging Level (OFF, SEVERE, WARNING, INFO, FINE, FINEST, DEBUG)
logLevel=INFO
