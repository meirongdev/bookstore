databaseChangeLog:
  - changeSet:
      id: 1-create-users-table
      author: meirong
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: date_of_birth
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: registered_at
                  type: timestamp
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: users

  - changeSet:
      id: 2-create-books-table
      author: meirong
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: copies
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: copies_available
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: img
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: bigint
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE books ADD CONSTRAINT chk_books_copies_positive CHECK (copies >= 0);
        - sql:
            sql: |
              ALTER TABLE books ADD CONSTRAINT chk_books_copies_available_positive CHECK (copies_available >= 0);
      rollback:
        - dropTable:
            tableName: books

  - changeSet:
      id: 3-create-genres-table
      author: meirong
      changes:
        - createTable:
            tableName: genres
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: description
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
      rollback:
        - dropTable:
            tableName: genres

  - changeSet:
      id: 4-create-books-genres-table
      author: meirong
      changes:
        - createTable:
            tableName: books_genres
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: genre_id
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: books_genres
            columnNames: book_id, genre_id
            constraintName: pk_books_genres
      rollback:
        - dropTable:
            tableName: books_genres

  - changeSet:
      id: 5-create-checkouts-table
      author: meirong
      changes:
        - createTable:
            tableName: checkouts
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_email
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: checkout_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: return_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: bigint
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: checkouts

  - changeSet:
      id: 6-create-reviews-table
      author: meirong
      changes:
        - createTable:
            tableName: reviews
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_email
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: user_first_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: user_last_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: rating
                  type: decimal(3, 2)
                  constraints:
                    nullable: false
              - column:
                  name: review_description
                  type: text
      rollback:
        - dropTable:
            tableName: reviews

  - changeSet:
      id: 7-create-book-loan-histories-table
      author: meirong
      changes:
        - createTable:
            tableName: book_loan_histories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_email
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: borrowed_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: returned_date
                  type: date
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: 'RETURNED'
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: bigint
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: book_loan_histories

  - changeSet:
      id: 8-create-discussions-table
      author: meirong
      changes:
        - createTable:
            tableName: discussions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_email
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: question
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: admin_email
                  type: varchar(100)
              - column:
                  name: response
                  type: text
              - column:
                  name: closed
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: bigint
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: discussions

  - changeSet:
      id: 9-create-payments-table
      author: meirong
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_email
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: decimal(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  defaultValue: 'usd'
                  constraints:
                    nullable: false
              - column:
                  name: stripe_payment_intent_id
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false
              - column:
                  name: payment_method_type
                  type: varchar(50)
              - column:
                  name: book_id
                  type: bigint
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: receipt_url
                  type: varchar(500)
              - column:
                  name: failure_message
                  type: varchar(1000)
              - column:
                  name: created_at
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: bigint
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_payments_stripe_payment_intent_id
            tableName: payments
            unique: true
            columns:
              - column:
                  name: stripe_payment_intent_id
        - createIndex:
            indexName: idx_payments_status
            tableName: payments
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_payments_created_at
            tableName: payments
            columns:
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_payments_book_id
            tableName: payments
            columns:
              - column:
                  name: book_id
      rollback:
        - dropTable:
            tableName: payments
