databaseChangeLog:
  - changeSet:
      id: 10-add-users-indexes
      author: meirong
      changes:
        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_users_role
            tableName: users
            columns:
              - column:
                  name: role
      rollback:
        - dropIndex:
            indexName: idx_users_email
            tableName: users
        - dropIndex:
            indexName: idx_users_role
            tableName: users

