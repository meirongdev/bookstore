spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: bookstore
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/bookstore_db}
    username: ${POSTGRES_USER:bookstoreadmin}
    password: ${POSTGRES_PASSWORD:bookstoreadmin}
  # sql:
  #   init:
  #     # Disable SQL initialization - now using Liquibase
  #     mode: never
  jpa:
    hibernate:
      ddl-auto: none
  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    # Optional: Drop all database objects before migration (use with caution!)
    # drop-first: false
    # Optional: Default schema
    # default-schema: public
    # Optional: Liquibase context
    # contexts: dev
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
  # Spring Boot 4 - HTTP client configuration
  http:
    clients:
      imperative:
        factory: jdk
  # Virtual Threads Configuration
  threads:
    virtual:
      enabled: true

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

jwt_secret: ${JWT_SECRET:}

# Stripe Configuration
stripe:
  api:
    key: ${STRIPE_SECRET_KEY:}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}

app:
  github:
    owner: "meirongdev"
    repo: "assets"
    branch: "main"
    # token 建议通过环境变量注入，不要在文件中写明明文
    token: "${GITHUB_TOKEN}"
    # 默认上传目录
    base-path: "bookstore"

# Observability Configuration
management:
  # server:
  #   port: ${MANAGEMENT_PORT:8081} # optional separate management port (useful in container setups)
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  info:
    java:
      enabled: true
    env:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    # add custom labels for all metrics
    tags:
      application: ${spring.application.name:bookstore}
      env: ${ENV:dev}

  # tracing:
  #   sampling:
  #     probability: 1.0

