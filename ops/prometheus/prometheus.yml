global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bookstore-backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['bookstore-springboot-backend:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
